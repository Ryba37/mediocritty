[package]
name = "mediocritty"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
objc2-core-text = "0.3.2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSView",
  "NSWindow",
  "NSResponder",
] }
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CAMetalLayer"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
